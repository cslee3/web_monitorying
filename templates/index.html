<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Making</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100vh; font-family: 'Segoe UI', sans-serif; }

    #loginContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background-color: #f5f5f5;
    }

    #loginBox {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    #loginBox h2 { margin-bottom: 20px; text-align: center; }

    #loginBox input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #loginBox button {
      width: 100%;
      padding: 10px;
      background-color: #202123;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #loginBox .error {
      color: red;
      font-size: 14px;
      text-align: center;
    }

    #mainApp {
      display: none;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 155px;
      background-color: #202123;
      color: white;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 16px;
      color: #ccc;
      padding-left: 0;   
    }

    .sidebar h2 a.home-link {
      font-size: 16px;     
      font-weight: bold;
      color: #FFB347;      /* ✅ 주황색 */
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      padding-left: 0;   
    }

    .sidebar h2 a.home-link:hover {
      color: #fff;         /* hover 시 흰색 */
    }


    .sidebar a {
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      color: #ccc;
      text-decoration: none;
      margin-bottom: 10px;
      transition: background-color 0.2s;
      cursor: pointer;
      font-weight: normal;
    }

    .sidebar a.active {
      font-weight: bold;
      color: #4DA6FF; 
    }

    .sidebar a:hover {
      background-color: #40414f;
      color: white;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background-color: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }

    .content {
      flex: 1;
      overflow: hidden;
    }

    iframe {
      width: 106%;
      height: 106%;
      transform: scale(0.95);
      transform-origin: top left;
      border: none;
    }

    /* SSF MM만 조금 더 축소 (스크롤바 제거) */
    iframe.ssfmm {
      width: 107.5%;
      height: 107.5%;
      transform: scale(0.93);
    }

  </style>
</head>
<body>

  <!-- 본문 앱 -->
  <div id="mainApp">
    <div class="sidebar">
      <h2>
        <a onclick="goHome()" class="home-link">Home</a>
      </h2>
      <h2 style="color:#FFB347;">PnL Report</h2>
      <a onclick="loadPnlReport()">PnL Report</a>
      <h2></h2>
      <h2 style="color:#FFB347;">Market Making</h2>
      <a onclick="loadPage('ssf_mm.html', 'SSF MM')">SSF MM</a>
      <a onclick="loadPage('ssf_mm2.html', 'SSF MM2')">SSF MM2</a>
      <a onclick="loadPage('sso_mm.html', 'SSO MM')">SSO MM</a>
    </div>

    <div class="main">
      <div class="topbar">
        <span id="pageTitle">
          GMT Market Making Part
        </span>
        <label id="dateLabel" class="date-label" lang="en" style="margin-left:16px; font-size:14px; display:none;">
          Date
        <input type="date" id="datePicker" style="margin-left:8px; padding:4px 6px;" lang="en" onchange="loadArchivePage()" />
      </label>
    </div>

      <div class="content">
        <iframe id="mainFrame" src="Welcome.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    let currentPage = "";
    let autoRefreshId = null;

    // PnL 파일명 대소문자 무관하게 후보 순서대로 시도
    function _loadPnlUrl(dateStr, displayDate) {
      const candidates = [
        `archive/PnL_Report_${dateStr}.html`,
        `archive/PNL_REPORT_${dateStr}.html`,
      ];
      const f = document.getElementById("mainFrame");
      const noDataMsg = `<html><body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#888;font-size:16px">해당 일자 데이터가 없습니다 (${displayDate})</body></html>`;

      function tryNext(i) {
        if (i >= candidates.length) { f.srcdoc = noDataMsg; return; }
        fetch(candidates[i], { method: "HEAD" })
          .then(res => {
            if (res.ok) {
              f.removeAttribute("srcdoc");
              f.src = candidates[i] + `?_=${Date.now()}`;
            } else {
              tryNext(i + 1);
            }
          })
          .catch(() => { tryNext(i + 1); });
      }
      tryNext(0);
    }

    function loadPnlReport() {
      currentPage = "PNL_REPORT";
      localStorage.setItem("lastPage", "PNL_REPORT");
      localStorage.setItem("lastTitle", "PnL Report");

      const titleEl = document.getElementById("pageTitle");
      if (titleEl) titleEl.textContent = "PnL Report";

      const links = document.querySelectorAll(".sidebar a");
      links.forEach(link => link.classList.remove("active"));
      event.target.classList.add("active");

      if (autoRefreshId) { clearInterval(autoRefreshId); autoRefreshId = null; }

      // PnL Report는 날짜 없이 고정 파일 1개를 로드 (매일 아침 export_html.py가 덮어씀)
      const dl = document.getElementById("dateLabel");
      if (dl) dl.style.display = "none";

      const f = document.getElementById("mainFrame");
      f.removeAttribute("srcdoc");
      f.src = `pnl_report.html?_=${Date.now()}`;
    }

    function loadArchivePage() {
      const dp = document.getElementById("datePicker");
      if (!dp || !currentPage) return;

      const dateStr = dp.value.replace(/-/g, "");
      const _t = new Date();
      const today = String(_t.getFullYear()) +
                    String(_t.getMonth() + 1).padStart(2, "0") +
                    String(_t.getDate()).padStart(2, "0");

      // 자동 새로고침 중단
      if (autoRefreshId) { clearInterval(autoRefreshId); autoRefreshId = null; }

      // PnL Report: 대소문자 무관하게 후보 순서대로 시도
      if (currentPage === "PNL_REPORT") {
        _loadPnlUrl(dateStr || today, dp.value);
        return;
      }

      // 오늘 날짜면 라이브 페이지
      if (!dateStr || dateStr === today) {
        loadPage(currentPage, document.getElementById("pageTitle")?.textContent || "");
        return;
      }

      const pageName = currentPage.replace(".html", "");
      const archiveUrl = `archive/${pageName}_${dateStr}.html`;

      fetch(archiveUrl, { method: "HEAD" })
        .then(res => {
          const f = document.getElementById("mainFrame");
          if (res.ok) {
            f.removeAttribute("srcdoc");
            f.src = archiveUrl;
          } else {
            f.srcdoc = `<html><body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#888;font-size:16px">` +
                       `해당 일자 데이터가 없습니다 (${dp.value})</body></html>`;
          }
        })
        .catch(() => {
          document.getElementById("mainFrame").srcdoc =
            `<html><body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#888;font-size:16px">` +
            `서버 연결 오류</body></html>`;
        });
    }

    function showMainApp() {
      document.getElementById("loginContainer").style.display = "none";
      document.getElementById("mainApp").style.display = "flex";
    }

    function loadPage(page, title) {
      currentPage = page;
      localStorage.setItem("lastPage", page);
      localStorage.setItem("lastTitle", title || "");
      const iframe = document.getElementById("mainFrame");
      iframe.removeAttribute("srcdoc");
      iframe.src = `${page}?_=${Date.now()}`;

      const titleEl = document.getElementById("pageTitle");
      if (titleEl && title) {
        titleEl.textContent = title;
      }

      const links = document.querySelectorAll(".sidebar a");
      links.forEach(link => link.classList.remove("active")); // 기존 active 제거
      event.target.classList.add("active"); // 현재 클릭한 메뉴만 active 추가

      // 달력(datePicker) 초기화 → 오늘 날짜로 설정 (로컬 날짜 기준)
      const dp = document.getElementById("datePicker");
      const dl = document.getElementById("dateLabel");
      if (dp) {
        const _n = new Date();
        dp.value = String(_n.getFullYear()) + "-" +
                   String(_n.getMonth() + 1).padStart(2, "0") + "-" +
                   String(_n.getDate()).padStart(2, "0");
      }
      if (dl) dl.style.display = "";

      // SSF MM만 축소 표시
      if (page === "ssf_mm.html") {
        iframe.classList.add("ssfmm");
      } else {
        iframe.classList.remove("ssfmm");
      }

      if (autoRefreshId) {
        clearInterval(autoRefreshId);
        autoRefreshId = null;
      }
    }

    // 페이지 로드시 localStorage 확인 → 마지막 탭 복원
    window.onload = () => {
      const dp = document.getElementById("datePicker");
      if (dp) {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        dp.value = `${year}-${month}-${day}`;
        dp.setAttribute('lang', 'en');
      }
      showMainApp();

      // 마지막 탭 복원
      const lastPage = localStorage.getItem("lastPage");
      const lastTitle = localStorage.getItem("lastTitle");
      if (lastPage) {
        if (lastPage === "PNL_REPORT") {
          // PnL Report는 sidebar 첫번째 링크 클릭으로 복원
          const pnlLink = document.querySelector(".sidebar a[onclick='loadPnlReport()']");
          if (pnlLink) pnlLink.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        } else {
          // 해당 페이지의 sidebar 링크 찾아서 active 처리
          const links = document.querySelectorAll(".sidebar a");
          let matched = false;
          links.forEach(link => {
            const oc = link.getAttribute("onclick") || "";
            if (oc.includes(`'${lastPage}'`)) {
              link.classList.add("active");
              matched = true;
            }
          });
          currentPage = lastPage;
          const iframe = document.getElementById("mainFrame");
          iframe.removeAttribute("srcdoc");
          iframe.src = `${lastPage}?_=${Date.now()}`;
          const titleEl = document.getElementById("pageTitle");
          if (titleEl && lastTitle) titleEl.textContent = lastTitle;
          const dl = document.getElementById("dateLabel");
          if (dl) dl.style.display = "";
        }
      }
    };

    function goHome() {
      currentPage = "";
      localStorage.removeItem("lastPage");
      localStorage.removeItem("lastTitle");
      const iframe = document.getElementById("mainFrame");
      iframe.src = "welcome.html"; 

      // 상단 타이틀 초기화
      const titleEl = document.getElementById("pageTitle");
      if (titleEl) {
        titleEl.textContent = "GMT Market Making Part";
      }

      // 날짜 picker 숨기기
      const dl = document.getElementById("dateLabel");
      if (dl) dl.style.display = "none";

      // 사이드바 active 초기화
      const links = document.querySelectorAll(".sidebar a");
      links.forEach(link => link.classList.remove("active"));

      // 자동 새로고침 중지
      if (autoRefreshId) {
        clearInterval(autoRefreshId);
        autoRefreshId = null;
      }
    }


  </script>

</body>
</html>
