<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 6px;
    background: #fff;
    overflow: hidden;
    gap: 16px;
  }
  #logo {
    max-width: 260px;
    width: 40%;
    flex-shrink: 0;
  }
  #photo {
    width: calc(100% - 80px);
    max-height: calc(100vh - 180px);
    object-fit: contain;
    border-radius: 8px;
    margin-bottom: 40px;
  }
</style>
</head>
<body>
  <img id="logo"  src="../static/logo.png" alt="Logo"/>
  <img id="photo" src="../static/elon.jpg" alt="Elon Musk"/>
</body>
</html>
