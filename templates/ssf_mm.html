<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>SSF MM Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', sans-serif; font-size: 11.9px; background: #fff; display: flex; flex-direction: column; overflow: hidden; }

  .info-bar {
    display: flex; align-items: center; gap: 20px;
    padding: 5px 10px; background: #eef2f6; border-bottom: 1px solid #d0d8e0;
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  .info-bar .item { font-size: 11px; }
  .info-bar .item span { font-weight: bold; }
  .updated { color: #222; font-size: 14px; font-weight: bold; }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; display: inline-block; margin-right: 6px;
    transition: background 0.2s;
  }
  .dot.live { background: #2ecc71; }
  .dot.error { background: #e74c3c; }

  .table-wrap { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: row; align-items: flex-start; gap: 10px; }
  .mm-col  { flex: none; }
  .idx-col { flex: none; display: flex; flex-direction: column; gap: 12px; padding-top: 2px; }
  #idxWrap table { border-collapse: collapse; white-space: nowrap; outline: 1px solid #000; outline-offset: -1px; margin: 0; }
  #idxWrap thead th { position: static; background: #DEE7ED; color: #000; font-weight: bold;
    padding: 4px 6px; font-size: 11.9px; text-align: center; border: 1px solid #b6c2cc; border-bottom: 1px solid #000; }
  #idxWrap td { padding: 2px 6px; border: 1px solid #e0e0e0; text-align: right; }
  #idxWrap tr:hover td { background: #fffde7 !important; }
  #idxWrap .total-row td { font-weight: bold; }

  table { border-collapse: collapse; white-space: nowrap; outline: 1px solid #000; outline-offset: -1px; margin-left: 3px; margin-top: 2px; }
  thead th {
    background: #DEE7ED; color: #000; font-weight: bold; padding: 3px 3px;
    position: sticky; top: 0; z-index: 5;
    font-size: 11.9px; text-align: center; border: 1px solid #b6c2cc; border-bottom: 1px solid #000;
    vertical-align: bottom;
  }
  thead th.diff-hdr { background: #FFC000; }
  .th-sub { display: block; font-weight: normal; font-size: 9px; opacity: 0.65; margin-top: 2px; }
  td { padding: 2px 3px; border: 1px solid #e0e0e0; font-size: 11.9px; }
  tr:hover td { background: #fffde7 !important; }
  .total-row td { font-weight: bold; border-top: 1px solid #000; border-bottom: 1px solid #000; box-shadow: inset 0 1px 0 #000; }
  .sep-row td { background: #f0f0f0; height: 5px; padding: 0; border: none; }


  /* .dim-row td { background: #d8e6f5; } */
  /* .dim-row td:first-child { border-left: 3px solid #7bafd4; } */
  /* .dim-row:hover td { background: #fffde7 !important; } */

  #status { padding: 40px; text-align: center; color: #888; font-size: 14px; }

  #filterBtn {
    font-size: 11px; padding: 2px 10px; cursor: pointer;
    border: 1px solid #999; border-radius: 3px;
    background: #fff; color: #333;
  }
  /* stripe: JS에서 td별 직접 적용 (alert/colorscale 컬럼 제외) */

  #filterBtn.active, #filterBtn2.active {
    background: #202123; color: #fff; border-color: #202123;
  }
  #filterBtn2 {
    font-size: 11px; padding: 2px 10px; cursor: pointer;
    border: 1px solid #999; border-radius: 3px;
    background: #fff; color: #333;
  }

  .delta-alert-n { font-weight: bold; color: #333; }
  .delta-alert-y { font-weight: bold; color: #cc0000; font-size: 16px; }
</style>
</head>
<body>

<div class="info-bar" id="infoBar" style="display:none">
  <span class="dot" id="liveDot"></span>
  <div class="item">BaseDate: <span id="hBaseDate"></span></div>
  <div class="item">Ytd: <span id="hYtd"></span></div>
  <div class="item">I/R: <span id="hIr"></span></div>
  <div class="item">Expiry1: <span id="hExp1"></span></div>
  <div class="item">Expiry2: <span id="hExp2"></span></div>
  <div class="item">Delta Alert: <span id="hU3"></span></div>
  <div class="item">Excel Updated: <span id="hV3"></span></div>
  <div class="updated">Updated: <span id="hUpdated">-</span></div>
  <button id="filterBtn" onclick="toggleFilter(1)">DIM 필터</button>
  <button id="filterBtn2" onclick="toggleFilter(2)">DIM 필터 2</button>
  <span id="monState" style="font-size:11px;color:#2ecc71;font-weight:bold;">● 실행중</span>
</div>

<div id="status">데이터 로딩 중...</div>

<div class="table-wrap" id="tableWrap" style="display:none">
  <div class="mm-col">
    <table id="mmTable">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="idx-col" id="idxWrap"></div>
</div>

<script>
let numCidx = new Set();

function setMonState(running) {
  const dot   = document.getElementById("liveDot");
  const state = document.getElementById("monState");
  if (running) {
    if (state) { state.textContent = "● 실행중"; state.style.color = "#2ecc71"; }
  } else {
    if (dot)   { dot.className = "dot"; }
    if (state) { state.textContent = "● 중지"; state.style.color = "#e74c3c"; }
  }
}

let colOrder = [];
let es = null;
let wasError = false;
let lastMsgTs = Date.now();   // 마지막 SSE 메시지 수신 시각
let sseWatchdogId = null;     // 무신호 감지 재연결 타이머

const DIM_STOCKS = new Set([
  "010950", // S-Oil
  "086280", // 현대글로비스
  "003230", // 삼양식품
  "008770", // 호텔신라
  "010130", // 고려아연
  "001800", // 오리온홀딩스
  "166090", // 하나머티리얼즈
  "108490", // 로보티즈
  "033780", // KT&G
  "011200", // HMM
  "326030", // SK바이오팜
  "010060", // OCI홀딩스
  "298020", // 효성티앤씨
  "222080", // 씨아이에스
  "000810", // 삼성화재
]);

let filterMode = 0; // 0=전체, 1=DIM만, 2=비DIM만

// stripe 배경 제외 컬럼: ColorScale(F/R/S/AB) + MM Spread Alert + Ex1/Ex2 Spread
const STRIPE_SKIP_CIDX = new Set([0, 1, 4, 10, 16, 17, 20, 21, 23, 24, 26]);

// 굵은 세로선(오른쪽 테두리) 적용 컬럼
const VLINE_CIDX = new Set([1, 3, 4, 6, 7, 10, 11, 12, 13, 15, 17, 18, 19, 21, 22, 24]);

// === idx(raw) 섹션 표시용 (ssf_mm2와 동일) ===
const GRAY_HDRS      = new Set(["IdxCode", "IndexCode", "IndexName", "Fund", "Udly"]);
const VLINE_HDRS     = new Set(["Fund", "Volume", "Udly"]);
const VLINE_BOTH_HDRS= new Set(["△Shares"]);

function setStripe(tr, isOdd) {
  tr.querySelectorAll("td").forEach((td, i) => {
    const cidx = colOrder[i]?.cidx;
    if (cidx !== undefined && !STRIPE_SKIP_CIDX.has(cidx)) {
      td.style.background = isOdd ? "#fff3e0" : "";
    }
  });
}

function toggleFilter(mode) {
  filterMode = (filterMode === mode) ? 0 : mode;
  document.getElementById("filterBtn").classList.toggle("active", filterMode === 1);
  document.getElementById("filterBtn2").classList.toggle("active", filterMode === 2);
  applyFilter();
}

function applyFilter() {
  // DIM 필터(1/2) 사용 시 우측 idx 표 숨김 → 전체 폭 축소
  const idxWrap = document.getElementById("idxWrap");
  if (idxWrap) idxWrap.style.display = filterMode === 0 ? "" : "none";
  const rows = document.querySelectorAll("#tbody tr");
  let visIdx = 0;
  rows.forEach(tr => {
    if (tr.classList.contains("sep-row") || tr.classList.contains("total-row")) {
      tr.style.display = filterMode === 0 ? "" : "none";
      return;
    }
    if (filterMode === 0) {
      tr.style.display = "";
      tr.dataset.stripe = "";
      setStripe(tr, false);
      return;
    }
    const tds = tr.querySelectorAll("td");
    const code = tds[0] ? tds[0].textContent.trim() : "";
    const name = tds[1] ? tds[1].textContent.trim() : "";
    const inDim = DIM_STOCKS.has(code);
    // DIM 필터 2: SK하이닉스·삼성전자 주식선물(각 2종) 제외
    const isDim2Exclude = filterMode === 2 && (name.includes("하이닉스") || name.includes("삼성전자"));
    const show = !isDim2Exclude && (filterMode === 1 ? inDim : !inDim);
    tr.style.display = show ? "" : "none";
    const isOdd = show && visIdx % 2 === 1;
    tr.dataset.stripe = isOdd ? "odd" : "";
    setStripe(tr, isOdd);
    if (show) visIdx++;
  });
}


async function loadFull() {
  try {
    const res = await fetch("/api/dashboard");
    if (!res.ok) { setTimeout(loadFull, 2000); return; }
    const d = await res.json();
    if (d.error) { setTimeout(loadFull, 2000); return; }
    buildTable(d);
    connectStream();
  } catch(e) {
    document.getElementById("status").textContent = "서버 연결 실패, 재시도 중...";
    setTimeout(loadFull, 2000);
  }
}

function buildTable(d) {
  // MM sections only (main / sum1 / sum2) — idx는 ssf_mm2.html에서 표시
  const mmSections = d.sections.filter(s => !s.raw);
  const firstSec   = mmSections[0];

  colOrder = firstSec.cols.map(([cidx, hdr, sub]) => ({ cidx, hdr, sub: sub || "" }));
  numCidx  = new Set(firstSec.num_cidx);

  document.getElementById("hBaseDate").textContent = d.header.base_date;
  document.getElementById("hYtd").textContent      = d.header.ytd;
  document.getElementById("hIr").textContent       = d.header.ir;
  document.getElementById("hExp1").textContent     = d.header.exp1;
  document.getElementById("hExp2").textContent     = d.header.exp2;
  const alertEl = document.getElementById("hU3");
  alertEl.textContent = d.header.u3;
  alertEl.className = d.header.u3 === "Y" ? "delta-alert-y" : "delta-alert-n";
  document.getElementById("hV3").textContent       = d.header.v3;
  document.getElementById("hUpdated").textContent  = d.updated;

  const tw = document.getElementById("tableWrap");
  const savedLeft = tw ? tw.scrollLeft : 0;
  const savedTop  = tw ? tw.scrollTop  : 0;

  // Amt Shr1 / Amt Shr2 → "Amt Shr" colspan=2 으로 묶기
  const AMT_SHR_CIDX = new Set([5, 6]);
  let theadHtml = "<tr>";
  let i = 0;
  while (i < colOrder.length) {
    const c = colOrder[i];
    if (c.cidx === 5) {
      const vs = VLINE_CIDX.has(6) ? ' style="border-right:1px solid #000"' : "";
      theadHtml += `<th colspan="2"${vs}>Amount<br>(Shares)</th>`;
      i += 2; // cidx 5, 6 함께 소비
    } else {
      const cls = c.cidx === 13 ? ' class="diff-hdr"' : "";
      const vs  = VLINE_CIDX.has(c.cidx) ? ' style="border-right:1px solid #000"' : "";
      const raw = c.sub || c.hdr;
      // MTM PnL(25) / Theo PnL(26) 는 1줄, 나머지는 첫 공백에서 2줄
      const label = (c.cidx === 25 || c.cidx === 26) ? raw : raw.replace(" ", "<br>");
      theadHtml += `<th${cls}${vs}>${label}</th>`;
      i++;
    }
  }
  theadHtml += "</tr>";
  document.getElementById("thead").innerHTML = theadHtml;

  let html = "";
  for (let si = 0; si < mmSections.length; si++) {
    const sec = mmSections[si];
    for (let ri = 0; ri < sec.rows.length; ri++) {
      const meta = sec.row_meta[ri];
      if (meta.sep) {
        html += `<tr class="sep-row"><td colspan="${colOrder.length}"></td></tr>`;
        continue;
      }
      const row = sec.rows[ri];
      const lastPrice = parseFloat((row["2"]?.v || "0").replace(/,/g, "")) || 0;
      // const isDim = DIM_STOCKS.has(row["0"]?.v || "");
      if (meta.total) {
        // 합계: 앞 2칼럼(Stock+StockName) 병합, 라벨 가운데 정렬
        const labelVal = [0, 1].map(c => row[String(c)]?.v || "").find(x => String(x).trim() !== "") || "";
        let h = `<tr class="total-row"><td colspan="2" style="background:#e2efda;text-align:center;border-right:1px solid #000">${labelVal}</td>`;
        for (let k = 2; k < colOrder.length; k++) {
          const cidx = colOrder[k].cidx;
          const cell = row[String(cidx)] || { v: "", color: "" };
          h += makeTd(sec.id, ri, cidx, cell, lastPrice, true);
        }
        html += h + "</tr>";
      } else {
        html += `<tr>`;
        for (const { cidx } of colOrder) {
          const cell = row[String(cidx)] || { v: "", color: "" };
          html += makeTd(sec.id, ri, cidx, cell, lastPrice, false);
        }
        html += "</tr>";
      }
    }
    // 섹션 간 구분선 (마지막 섹션 제외)
    if (si < mmSections.length - 1) {
      html += `<tr class="sep-row"><td colspan="${colOrder.length}"></td></tr>`;
    }
  }

  document.getElementById("tbody").innerHTML = html;

  buildIdxTables(d);

  document.getElementById("status").style.display    = "none";
  document.getElementById("infoBar").style.display   = "flex";
  document.getElementById("tableWrap").style.display = "flex";

  lockColWidths();

  // 재빌드(재연결 등) 후 행·idx(#idxWrap)를 현재 DIM 필터 상태에 항상 재동기화
  // → 필터 풀림 + idx만 숨김 채 남는 불일치 방지
  applyFilter();

  if (tw) { tw.scrollLeft = savedLeft; tw.scrollTop = savedTop; }
}

// idx(raw) 섹션 표 → 우측 #idxWrap (ssf_mm2 로직 포팅)
function buildIdxTables(d) {
  const idxSections = d.sections.filter(s => s.raw);
  let html = "";
  for (const sec of idxSections) {
    const rows = sec.rows;
    if (!rows.length) continue;

    const headerVals = sec.has_header ? rows[0].map(c => c.v) : (sec.header || []);
    const grayCi  = new Set();
    const vlineCi = new Set();
    headerVals.forEach((h, i) => {
      const name = String(h).trim();
      if (GRAY_HDRS.has(name))  grayCi.add(i);
      if (VLINE_HDRS.has(name)) vlineCi.add(i);
      if (VLINE_BOTH_HDRS.has(name)) { vlineCi.add(i); if (i > 0) vlineCi.add(i - 1); }
    });
    if (sec.id === "idx6") headerVals.forEach((h, i) => {
      if (["Delta", "Gamma", "Amt"].includes(String(h).trim())) vlineCi.add(i);
    });
    if (sec.id === "idx2" || sec.id === "idxS") grayCi.add(0);
    if (sec.id === "idx2" || sec.id === "idxS" || sec.id === "idx7") vlineCi.add(0);

    const startRow  = sec.has_header ? 1 : 0;
    const theadHtml = headerVals.length
      ? "<thead><tr>" + headerVals.map((h, i) =>
          `<th${vlineCi.has(i) ? ' style="border-right:1px solid #000"' : ''}>${h}</th>`).join("") + "</tr></thead>"
      : "";

    const isIdx7 = sec.id === "idx7";
    const SUBHDR_VALS = new Set(["△Amount", "Strike", "Theo PnL", "MTM PnL"]);
    let tbody = "";
    for (let ri = startRow; ri < rows.length; ri++) {
      const row = rows[ri];
      const isTotal = String((row[0] && row[0].v) || "").trim() === "합계";
      if (isTotal) {
        const span = Math.min(3, row.length);
        const mergeVline = vlineCi.has(span - 1) ? ";border-right:1px solid #000" : "";
        let cells = `<td colspan="${span}" style="background:#e2efda;text-align:center;box-shadow:inset 0 1px 0 #000${mergeVline}">합계</td>`;
        for (let ci = span; ci < row.length; ci++) {
          const vl = vlineCi.has(ci) ? "border-right:1px solid #000;" : "";
          cells += `<td id="c-${sec.id}-${ri}-${ci}" style="background:#fff;box-shadow:inset 0 1px 0 #000;${vl}">${(row[ci] && row[ci].v) || ""}</td>`;
        }
        tbody += `<tr class="total-row">${cells}</tr>`;
        continue;
      }
      const isCostRow = row.some(c => String((c && c.v) || "").trim() === "Cost");
      const u0 = String((row[0] && row[0].v) || "").trim();
      const topLine    = isCostRow || (sec.id === "idx6" && (u0 === "KSQ150" || ri === rows.length - 1));
      const bottomLine = isCostRow || (sec.id === "idx3" && u0 === "K2G01P");
      const _sh = [];
      if (topLine)    _sh.push("inset 0 1px 0 #000");
      if (bottomLine) _sh.push("inset 0 -1px 0 #000");
      const boxShadow = _sh.length ? `box-shadow:${_sh.join(",")}` : "";
      tbody += "<tr>" + row.map((cell, ci) => {
        const v     = cell.v;
        const bg    = cell.bg || "";
        const alert = ci === 0 && v === "Alert";
        let style   = "";
        const gray  = grayCi.has(ci) && !(isCostRow && ci < 2);
        if (sec.id === "idx5" && SUBHDR_VALS.has(v)) style = "background:#DEE7ED;color:#000;font-weight:bold;text-align:center;box-shadow:" + ((v === "Theo PnL" || v === "MTM PnL") ? "inset 0 2px 0 #000" : "inset 0 2px 0 #000,inset 0 -2px 0 #000");
        else if (isIdx7 && ci === 0) style = "background:#DEE7ED;color:#000;font-weight:bold";
        else if (alert)         style = "background:#ffff00;color:#cc0000;font-weight:bold;text-align:center";
        else if (bg)            style = `background:${bg}`;
        else if (gray)          style = "background:#D9D9D9";
        if (vlineCi.has(ci) && !(isCostRow && String(v).trim() === "Cost"))
                                style += (style ? ";" : "") + "border-right:1px solid #000";
        if (boxShadow)          style += (style ? ";" : "") + boxShadow;
        const grayAttr = gray ? ' data-gray="1"' : "";
        return `<td id="c-${sec.id}-${ri}-${ci}"${grayAttr}${style ? ` style="${style}"` : ""}>${v}</td>`;
      }).join("") + "</tr>";
    }

    html += `<div class="table-section"><table>${theadHtml}<tbody>${tbody}</tbody></table></div>`;
  }
  document.getElementById("idxWrap").innerHTML = html;
}

// 컬럼 폭을 빌드 시점(전체 행) 기준으로 고정 → DIM 필터로 행 숨겨도 폭 불변. Diff(cidx 13)는 1.2배.
function lockColWidths() {
  const table = document.getElementById("mmTable");
  if (!table) return;
  // 재측정 전 이전 고정폭 초기화 → 자연폭 기준으로 다시 측정(재연결 반복 시 폭 누적 방지)
  table.style.tableLayout = "auto";
  table.style.width = "";
  table.style.minWidth = "";
  table.style.maxWidth = "";
  const oldCg = table.querySelector("colgroup");
  if (oldCg) oldCg.remove();
  let row = null;
  for (const tr of document.getElementById("tbody").querySelectorAll("tr")) {
    if (!tr.classList.contains("sep-row") && !tr.classList.contains("total-row")) { row = tr; break; }
  }
  if (!row) return;
  const tds = row.children;
  if (tds.length !== colOrder.length) return;
  const cg = document.createElement("colgroup");
  let total = 0;
  for (let k = 0; k < tds.length; k++) {
    let w = tds[k].getBoundingClientRect().width;
    if (colOrder[k] && colOrder[k].cidx === 13) w *= 1.2;
    w = Math.round(w);
    const col = document.createElement("col");
    col.style.width = w + "px";
    cg.appendChild(col);
    total += w;
  }
  table.insertBefore(cg, table.firstChild);
  table.style.tableLayout = "fixed";
  // 표 전체 폭도 픽셀로 못박음 → flex 레이아웃/필터로 행 숨겨도 폭 불변
  table.style.width = total + "px";
  table.style.minWidth = total + "px";
  table.style.maxWidth = total + "px";
}

// F=4, R=16, S=17, AB=26 — ColorScale 그라디언트 적용 컬럼
const CS_CIDX = new Set([4, 16, 17, 26]);

// 주식 호가 틱 단위 (common.py STOCK_TICK_TABLE 동일)
function getStockTick(price) {
  if (price <    2000) return 1;
  if (price <    5000) return 5;
  if (price <   20000) return 10;
  if (price <   50000) return 50;
  if (price <  200000) return 100;
  if (price <  500000) return 500;
  return 1000;
}

const SPREAD_CIDX = new Set([20, 21, 23, 24]);

function spreadStyle(sp, lastPrice) {
  const tick = getStockTick(lastPrice);
  if (sp > 0)            return { bg: "#ffff00", color: "#cc0000", fw: "bold" };
  if (sp + tick > 0)     return { bg: "",        color: "#cc0000", fw: "bold" };
  return                          { bg: "",        color: "",        fw: ""     };
}

function applySpreadStyle(td, sp, lastPrice) {
  const s = spreadStyle(sp, lastPrice);
  td.style.background = s.bg;
  td.style.color      = s.color;
  td.style.fontWeight = s.fw;
}

function makeTd(sid, ri, cidx, cell, lastPrice, isTotal) {
  const styles = [];
  const align = cidx === 10 ? "center" : (numCidx.has(cidx) ? "right" : "left");
  styles.push(`text-align:${align}`);

  // Stock / StockName 회색 배경 (Excel #D9D9D9)
  if (cidx === 0 || cidx === 1) styles.push("background:#D9D9D9");

  // 굵은 세로선 (지정 컬럼 오른쪽)
  if (VLINE_CIDX.has(cidx)) styles.push("border-right:1px solid #000");

  // Change(%) 색상: 양수 빨강, 음수 파랑 (Excel 서식 동일)
  if (cidx === 3) {
    const n = parseFloat(String(cell.v).replace("%", "")) || 0;
    if (n > 0)      styles.push("color:#ff0000");
    else if (n < 0) styles.push("color:#0000ff");
  }

  // △Shares 색상: 음수 빨강, 양수 검정 (cidx 12)
  if (cidx === 12) {
    const n = parseFloat(String(cell.v).replace(/,/g, "")) || 0;
    styles.push(n < 0 ? "color:#ff0000" : "color:#000");
  }

  // Amount(Shares) 음수 빨강 + 두 칸 동일 너비(8자리 수용) (cidx 5, 6)
  if (cidx === 5 || cidx === 6) {
    const n = parseFloat(String(cell.v).replace(/,/g, "")) || 0;
    if (n < 0) styles.push("color:#ff0000");
    styles.push("width:56px;min-width:56px;max-width:56px");
  }

  // Theo Basis 너비 ~1.2배 (cidx 19, 22)
  if (cidx === 19 || cidx === 22) styles.push("min-width:50px");

  // ColorScale 배경 (F/Q/R/AA열)
  if (CS_CIDX.has(cidx) && cell.bg) {
    styles.push(`background:${cell.bg}`);
  }

  // MM Spread Alert (cidx 10 = "MM Spread")
  if (cidx === 10 && cell.v === "Alert") {
    styles.push("background:#ffff00");
    styles.push("color:#cc0000");
    styles.push("font-weight:bold");
  }

  // Spread Alert (Ex1 B-Sp/S-Sp, Ex2 B-Sp/S-Sp)
  if (SPREAD_CIDX.has(cidx)) {
    const s = spreadStyle(parseFloat(cell.v.replace(/,/g, "")) || 0, lastPrice || 0);
    if (s.bg)    styles.push(`background:${s.bg}`);
    if (s.color) styles.push(`color:${s.color}`);
    if (s.fw)    styles.push(`font-weight:${s.fw}`);
  }

  // 합계 행: "합계" 셀만 녹색, 나머지는 회색 (마지막에 push하여 배경 override)
  if (isTotal) {
    styles.push(`background:${String(cell.v).trim() === "합계" ? "#e2efda" : "#fff"}`);
  }

  return `<td id="c-${sid}-${ri}-${cidx}" style="${styles.join(";")}">${cell.v}</td>`;
}

function connectStream() {
  if (es) es.close();
  lastMsgTs = Date.now();
  es = new EventSource("/api/stream");

  es.onopen = () => {
    lastMsgTs = Date.now();
    document.getElementById("liveDot").className = "dot";
    if (wasError) {
      wasError = false;
      fetch("/api/dashboard").then(r => r.ok ? r.json() : null)
        .then(d => { if (d && !d.error) buildTable(d); }).catch(() => {});
    } else {
      // 재연결 없이도 full_data의 updated 동기화
      fetch("/api/dashboard").then(r => r.ok ? r.json() : null)
        .then(d => { if (d && !d.error) document.getElementById("hUpdated").textContent = d.updated; })
        .catch(() => {});
    }
  };

  es.onmessage = (e) => {
    lastMsgTs = Date.now();
    const d = JSON.parse(e.data);
    if (d.type === "connected") { setMonState(d.running); return; }
    if (d.type === "monitor_paused")  { setMonState(false); return; }
    if (d.type === "monitor_resumed") { setMonState(true);  return; }
    applyChanges(d.cells, d.updated, d.header);
  };

  es.onerror = () => {
    document.getElementById("liveDot").className = "dot error";
    wasError = true;
  };

  // 무신호 감지 → 자동 재연결 (서버는 ~1초마다 push하므로 12초 무신호면 연결 죽은 것)
  if (!sseWatchdogId) {
    sseWatchdogId = setInterval(() => {
      if (Date.now() - lastMsgTs > 12000) {
        document.getElementById("liveDot").className = "dot error";
        wasError = true;
        connectStream();
      }
    }, 4000);
  }
}

function applyChanges(cells, updated, header) {
  document.getElementById("hUpdated").textContent = updated;
  if (header) {
    document.getElementById("hV3").textContent = header.v3;
    const alertEl = document.getElementById("hU3");
    alertEl.textContent = header.u3;
    alertEl.className = header.u3 === "Y" ? "delta-alert-y" : "delta-alert-n";
  }

  for (const { key, v, color, bg } of cells) {
    const parts = key.split("_");
    const sid  = parts[0];
    const ri   = parts[1];
    const cidx = Number(parts[2]);

    // idx(raw) 섹션 셀 갱신 (ssf_mm2 로직 포팅)
    if (sid.startsWith("idx")) {
      const itd = document.getElementById(`c-${sid}-${ri}-${parts[2]}`);
      if (!itd) continue;
      itd.textContent = v;
      if (Number(parts[2]) === 0) {
        if (v === "Alert") { itd.style.background = "#ffff00"; itd.style.color = "#cc0000"; itd.style.fontWeight = "bold"; }
        else { itd.style.background = itd.dataset.gray ? "#D9D9D9" : ""; itd.style.color = ""; itd.style.fontWeight = ""; }
      } else {
        itd.style.background = bg || (itd.dataset.gray ? "#D9D9D9" : "");
      }
      continue;
    }

    const td = document.getElementById(`c-${sid}-${ri}-${cidx}`);
    if (!td) continue;

    td.textContent = v;

    // 합계 행: 값이 갱신돼도 회색 유지 ("합계" 셀은 녹색)
    if (td.parentElement && td.parentElement.classList.contains("total-row")) {
      td.style.background = String(v).trim() === "합계" ? "#e2efda" : "#fff";
      continue;
    }

    // Change(%) 색상 실시간 적용 (양수 빨강, 음수 파랑)
    if (cidx === 3) {
      const n = parseFloat(String(v).replace("%", "")) || 0;
      td.style.color = n > 0 ? "#ff0000" : (n < 0 ? "#0000ff" : "");
    }

    // △Shares 색상 실시간 적용 (음수 빨강, 양수 검정)
    if (cidx === 12) {
      const n = parseFloat(String(v).replace(/,/g, "")) || 0;
      td.style.color = n < 0 ? "#ff0000" : "#000";
    }

    // Amount(Shares) 음수 빨강 실시간 (cidx 5, 6)
    if (cidx === 5 || cidx === 6) {
      const n = parseFloat(String(v).replace(/,/g, "")) || 0;
      td.style.color = n < 0 ? "#ff0000" : "";
    }

    // ColorScale 배경 실시간 갱신
    if (CS_CIDX.has(cidx)) {
      td.style.background = bg || "";
    }

    // MM Spread Alert 실시간 적용/해제
    if (cidx === 10) {
      if (v === "Alert") {
        td.style.background = "#ffff00";
        td.style.color      = "#cc0000";
        td.style.fontWeight = "bold";
      } else {
        td.style.background = "";
        td.style.color      = "";
        td.style.fontWeight = "";
      }
    }

    // Spread Alert 실시간 적용/해제
    if (SPREAD_CIDX.has(cidx)) {
      const lpTd = document.getElementById(`c-${sid}-${ri}-2`);
      const lastPrice = lpTd ? parseFloat(lpTd.textContent.replace(/,/g, "")) || 0 : 0;
      applySpreadStyle(td, parseFloat(v.replace(/,/g, "")) || 0, lastPrice);
    }

  }

  const dot = document.getElementById("liveDot");
  dot.classList.add("live");
  setTimeout(() => dot.classList.remove("live"), 300);
}

loadFull();
</script>
